{% extends 'todo/base.html' %}

{% block title %}Password Reset Complete | TaskFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-4 sm:py-8">

    <div class="relative bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden text-center p-8 space-y-5 transition-colors duration-200">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Password Reset Successful!</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-sm mx-auto leading-relaxed">
                Your new password has been set. You can now sign in using your new credentials.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'login' %}" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-sm shadow-indigo-600/20">
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
                <span>Sign In Now</span>
            </a>
        </div>
    </div>

</div>
{% endblock %}
